# T-Cell Baseline Configuration
experiment_id: tcell_baseline
plugin: mammalian.immune_tcell
simulator: mechanistic
simulation_length: 75.0
timestep: 0.5
output_path: outputs/tcell/baseline/
save_interval: 1
