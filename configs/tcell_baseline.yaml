  oxygen_level: 21.0
  glucose_concentration: 5.0
  nutrient_availability: {}
  stress_factors: {}

# Perturbations (naive baseline)
perturbations: []

# Metadata
metadata:
  description: "Baseline naive T-cell"
  researcher: "ISEF Project"
