# Minimal Cell Baseline Configuration
experiment_id: minimal_cell_baseline
plugin: bacteria.minimal_cell
simulator: mechanistic
simulation_length: 50.0
timestep: 0.5
output_path: outputs/minimal_cell/baseline/
save_interval: 1
seed: 42

# Environment settings
environment:
  temperature: 37.0
  ph: 7.4
  oxygen_level: 21.0
  glucose_concentration: 5.0
  nutrient_availability: {}
  stress_factors: {}

# Perturbations (empty for baseline)
perturbations: []

# Metadata
metadata:
  description: "Baseline simulation of minimal bacterial cell"
  researcher: "ISEF Project"
